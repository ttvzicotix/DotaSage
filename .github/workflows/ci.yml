name: Verify DotaSage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Guard current DotaSage branding
        run: |
          if grep -R -n -I "DraftSage" src public companion scripts README.md index.html package.json vercel.json vite.config.js; then
            echo "Old DraftSage branding found in active product/source files."
            exit 1
          fi
